# Blueprint de Render: UN solo Web Service Docker (frontend React + API FastAPI).
# Ver docs/deployment-render.md para el procedimiento completo y los límites del plan gratuito.
#
# Lo que NO se crea aquí (a propósito):
# - Base de datos PostgreSQL en Render: la base vive en Supabase.
# - Segundo servicio para el frontend, Redis, workers o cron.
# - Comando de migraciones antes del despliegue: no está disponible en el plan gratuito y las migraciones
#   se aplican con Supabase CLI o CI/CD, fuera del arranque del contenedor.
#
# Valores con `sync: false`: se introducen en el panel de Render. NUNCA se escriben en este archivo.

services:
  - type: web
    name: logixtic-client-portal
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # --- Configuración no secreta ---
      - key: APP_ENV
        value: production
      - key: DOCS_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_APP_ROLE
        value: portal_app
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_MAX_OVERFLOW
        value: "0"
      - key: JWT_LEEWAY_SECONDS
        value: "30"
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      # La modalidad QA requiere autorización en Render y la bandera equivalente en PostgreSQL.
      # Se mantiene fuera del repositorio para que un servicio nuevo no la active por defecto.
      - key: QA_SYNTHETIC_ENABLED
        sync: false
      # Mismo origen: no hace falta CORS. Lista JSON vacía.
      - key: CORS_ALLOWED_ORIGINS
        value: "[]"

      # --- Logix / OpenRouter ---
      # Ambas banderas deben ser true para permitir procesamiento externo. Sin autorización, Logix conserva
      # únicamente las consultas deterministas a PostgreSQL.
      - key: LOGIX_AI_ENABLED
        value: "false"
      - key: LOGIX_EXTERNAL_PROCESSING_AUTHORIZED
        value: "false"
      - key: LOGIX_RAG_ENABLED
        value: "false"
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: LOGIX_MAX_INPUT_TOKENS
        value: "4000"
      - key: LOGIX_MAX_OUTPUT_TOKENS
        value: "800"
      - key: LOGIX_TIMEOUT_SECONDS
        value: "20"
      - key: LOGIX_MAX_REQUESTS_PER_USER_PER_HOUR
        value: "30"

      # --- Secretos y datos de conexión: se introducen en el panel de Render ---
      # Conexión del rol de servicio de la API (sin BYPASSRLS). Ver docs/supabase-preparation.md.
      - key: DATABASE_URL
        sync: false
      # URL del proyecto Supabase (pública, pero específica de cada entorno).
      - key: SUPABASE_URL
        sync: false
      # Uno de los dos modos de verificación de JWT. No configurar ambos.
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Clave privilegiada de Supabase Storage (documentos). Solo en tiempo de ejecución de la API.
      # Nunca como build arg ni en el frontend. Sin ella, las rutas de documentos responden 503.
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STORAGE_SIGNED_URL_SECONDS
        value: "300"

      # --- Build-time (públicos, declarados como ARG en el Dockerfile). Ver docs/deployment-render.md ---
      - key: VITE_AUTH_PROVIDER
        value: supabase
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
