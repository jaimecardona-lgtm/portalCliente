# Isolated P0.6 database verification. Supplements (does not replace) verify.yml.
# Never connects to Supabase or any company environment.
name: p06 QA database verification

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'supabase/migrations/**'
      - '.github/workflows/verify-p06.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: p06-ephemeral-only
          POSTGRES_DB: portal_p06
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: p06-ephemeral-only
      PORTAL_TEST_DATABASE_URL: postgresql+psycopg://postgres:p06-ephemeral-only@127.0.0.1:5432/portal_p06
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend with test dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"
      - name: Apply canonical migrations to ephemeral Postgres
        run: |
          set -euo pipefail
          for file in $(find supabase/migrations -maxdepth 1 -name '*.sql' | sort); do
            echo "Applying $file"
            psql "postgresql://postgres@127.0.0.1:5432/portal_p06" -v ON_ERROR_STOP=1 -q -f "$file"
          done
          psql "postgresql://postgres@127.0.0.1:5432/portal_p06" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: Check P0.6 quote/document migration structures
        run: |
          psql "postgresql://postgres@127.0.0.1:5432/portal_p06" -v ON_ERROR_STOP=1 -Atc "
          SELECT CASE WHEN to_regclass('public.quotes') IS NOT NULL
                    AND to_regclass('public.quote_lines') IS NOT NULL
                    AND to_regclass('public.qa_seed_records') IS NOT NULL
               THEN 'ready' ELSE 'missing' END;
          " | grep -Fx ready
      - name: Run backend tests against ephemeral database
        working-directory: apps/api
        run: python -m pytest -q
