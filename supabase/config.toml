# Configuración de Supabase CLI para el Portal de Clientes Logixtic.
# Fuente canónica del esquema: supabase/migrations/*.sql. Ver docs/database-migration-strategy.md.
# No contiene secretos. Las claves reales viven en variables de entorno o en el panel del proyecto.

project_id = "logixtic-client-portal"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
double_confirm_changes = true
